name: Rebuild portfolio content

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/portfolio-build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install the TypeScript compiler
        run: npm ci

      - name: Build content and refresh asset versions
        run: npm run build

      - name: Commit generated files when they change
        run: |
          if git diff --quiet -- assets/js/portfolio.js index.html; then
            echo "Generated files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/portfolio.js index.html
          git commit -m "chore: rebuild portfolio content"
          git push origin HEAD:main
