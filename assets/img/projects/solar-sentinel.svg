<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">SolarSentinel solar flare forecasting artwork</title>
  <desc id="desc">A satellite, the Sun, and a forecasting waveform on a deep blue technical grid.</desc>
  <defs>
    <radialGradient id="sun" cx="38%" cy="34%" r="68%"><stop offset="0" stop-color="#fff4bd"/><stop offset=".28" stop-color="#ffbd55"/><stop offset=".7" stop-color="#e9682e"/><stop offset="1" stop-color="#8d2f28"/></radialGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#ff9c42" stop-opacity=".45"/><stop offset="1" stop-color="#ff9c42" stop-opacity="0"/></radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3f76a8"/><stop offset="1" stop-color="#152d51"/></linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#a8c5e8" stroke-opacity=".07"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1440" height="900" fill="#08111f"/><rect width="1440" height="900" fill="url(#grid)"/>
  <path d="M0 150H1440M0 750H1440M110 0V900M1330 0V900" stroke="#90add1" stroke-opacity=".13"/>
  <g font-family="monospace" font-size="19" letter-spacing="3" fill="#8fa7c4">
    <text x="70" y="82">[ BAH 2026 / ADITYA-L1 ]</text><text x="970" y="82">SOLAR FORECASTING</text>
  </g>
  <circle cx="1010" cy="425" r="360" fill="url(#glow)" filter="url(#blur)"/>
  <ellipse cx="1010" cy="425" rx="350" ry="170" fill="none" stroke="#e9b072" stroke-opacity=".28" stroke-dasharray="9 14" transform="rotate(-18 1010 425)"/>
  <circle cx="1010" cy="425" r="184" fill="url(#sun)"/>
  <path d="M900 354c58-56 128-74 214-38M886 447c86 48 179 52 266 3M936 546c63 22 119 17 176-13" fill="none" stroke="#fff0c4" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"/>
  <g transform="translate(260 355)">
    <path d="M165 80L545 32" stroke="#7ea6cf" stroke-opacity=".45" stroke-dasharray="7 12"/>
    <rect x="99" y="45" width="140" height="100" rx="8" fill="#b8c5d2" stroke="#eef5ff" stroke-opacity=".6"/>
    <rect x="124" y="65" width="90" height="60" fill="#34485c"/><circle cx="169" cy="95" r="20" fill="#0e1d30" stroke="#70d6e8" stroke-width="4"/>
    <path d="M99 95H0M239 95h98" stroke="#b8c5d2" stroke-width="13"/>
    <g fill="url(#panel)" stroke="#79a4cf" stroke-width="2">
      <rect x="-175" y="37" width="175" height="116"/><rect x="337" y="37" width="175" height="116"/>
    </g>
    <g stroke="#8cb8de" stroke-opacity=".45"><path d="M-117 37v116M-58 37v116M395 37v116M454 37v116M-175 95H0M337 95h175"/></g>
    <path d="M169 45V0m-26 0h52" stroke="#b8c5d2" stroke-width="6"/>
  </g>
  <g font-family="monospace" fill="#b7c9de">
    <text x="90" y="665" font-size="18" letter-spacing="2">BILSTM + TEMPORAL CNN</text>
    <text x="90" y="700" font-size="15" fill="#6f89a8">PHYSICS-INFORMED FEATURES / ANOMALY DETECTION</text>
  </g>
  <path d="M90 790h135l22-38 29 75 31-110 32 73h80l25-29 29 58 33-95 28 66h96l30-42 31 42h110l28-72 33 72h110l30-35 30 35h125" fill="none" stroke="#55d4e8" stroke-width="4" stroke-linejoin="round"/>
  <path d="M90 825H1350" stroke="#8fa7c4" stroke-opacity=".25"/>
  <text x="1170" y="855" font-family="monospace" font-size="16" fill="#6f89a8">01 / AI-ML</text>
</svg>
